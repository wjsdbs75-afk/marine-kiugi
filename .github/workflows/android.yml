name: 안드로이드 APK 빌드

# android/ 폴더가 바뀌었을 때만 다시 빌드한다. 게임(game.html)만 고쳤을 때는 빌드할 필요가 없다.
# 앱은 켤 때마다 Pages 에서 최신 게임을 받아 오기 때문이다.
# 수동 실행: Actions 탭 → "안드로이드 APK 빌드" → Run workflow
#
# 주의: 이 파일의 이름(android.yml)을 바꾸지 말 것. 앱의 버전 번호로 쓰는 실행 횟수(run_number)가
# 1 부터 다시 시작해서, 새 APK 가 기존 앱 위에 설치되지 않는다 (지우고 깔면 게임 저장이 사라진다).

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write   # 릴리스에 APK 를 올리는 데 필요

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'
          cache-disabled: true

      # 정식 서명 키는 저장소 Settings → Secrets and variables → Actions 에 넣어 둔다:
      #   KEYSTORE_BASE64   키 저장소 파일을 base64 로 바꾼 글자
      #   KEYSTORE_PASSWORD 키 저장소 비밀번호
      - name: 서명 키 준비
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Secrets 의 서명 키로 서명합니다."
          else
            echo "::warning::서명 키(Secrets 의 KEYSTORE_BASE64)가 없어 시험용 키로 서명합니다. 이 APK 는 릴리스에 올리지 않습니다."
          fi

      - name: APK 빌드
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleRelease -PshellVersionCode=${{ github.run_number }}

      - name: 파일 이름 정리
        run: cp android/app/build/outputs/apk/release/*.apk marine-kiugi.apk

      - uses: actions/upload-artifact@v7
        with:
          name: marine-kiugi-apk
          path: marine-kiugi.apk

      # 휴대폰 브라우저에서 로그인 없이 바로 받을 수 있는 고정 주소:
      # https://github.com/<계정>/<저장소>/releases/download/apk/marine-kiugi.apk
      - name: 릴리스에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ -z "${KEYSTORE_FILE:-}" ]; then
            echo "시험용 키로 서명한 빌드라 릴리스에는 올리지 않습니다. (위쪽 Artifacts 에서만 받을 수 있습니다.)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          notes="껍데기 앱 빌드 #${{ github.run_number }} (${GITHUB_SHA::7}). 게임 본체는 앱을 켤 때마다 GitHub Pages 에서 최신으로 받아 옵니다."
          if gh release view apk >/dev/null 2>&1; then
            gh release edit apk --notes "$notes"
          else
            gh release create apk --title "마린 키우기 APK" --notes "$notes" --target "$GITHUB_SHA"
          fi
          gh release upload apk marine-kiugi.apk --clobber
