name: 아이폰 앱 빌드 (TestFlight)

# ios/ 폴더가 바뀌었을 때만 다시 빌드한다. 게임(game.html)만 고쳤을 때는 필요 없다 (앱이 켤 때 Pages 에서 받아 온다).
# 수동 실행: Actions 탭 → "아이폰 앱 빌드 (TestFlight)" → Run workflow
#
# 주의: 이 파일의 이름(ios.yml)을 바꾸지 말 것. 빌드 번호로 쓰는 실행 횟수(run_number)가 1 부터 다시 시작하면
# 이미 올린 번호와 겹쳐 TestFlight 업로드가 거절된다.
#
# 저장소 Settings → Secrets and variables → Actions 에 넣어 두는 값 (없으면 컴파일 확인만 한다):
#   APPLE_TEAM_ID        애플 개발자 팀 ID (10자리)
#   APPSTORE_KEY_ID      App Store Connect API 키 ID
#   APPSTORE_ISSUER_ID   App Store Connect API 발급자(Issuer) ID
#   APPSTORE_KEY_P8      API 키 파일(AuthKey_XXXX.p8)의 내용 전체
# 인증서와 프로비저닝 프로파일은 이 API 키로 Xcode 가 알아서 만든다 (저장소에 넣지 않는다).

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: 가장 새 Xcode 고르기
        run: |
          x=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$x"
          xcodebuild -version

      - name: Xcode 프로젝트 만들기 (XcodeGen)
        working-directory: ios
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate

      - name: API 키 준비
        env:
          KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$KEY_P8" ] && [ -n "$KEY_ID" ] && [ -n "$ISSUER" ] && [ -n "$TEAM" ]; then
            printf '%s\n' "$KEY_P8" > "$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
            echo "SIGN=1" >> "$GITHUB_ENV"
          else
            echo "::warning::App Store Connect 키(Secrets)가 없어 컴파일 확인만 합니다. TestFlight 에는 올리지 않습니다."
          fi

      - name: 컴파일 확인 (서명 없이)
        if: env.SIGN != '1'
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project MarineKiugi.xcodeproj -scheme MarineKiugi -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40

      - name: 번들 ID 등록과 앱 확인
        if: env.SIGN == '1'
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          BUNDLE_ID: io.github.wjsdbs75afk.marinekiugi
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography 2>/dev/null || python3 -m pip install --quiet pyjwt cryptography
          export KEY_PATH="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          python3 ios/tools/asc.py ensure-bundle-id
          if ! python3 ios/tools/asc.py has-app; then
            msg="App Store Connect → 앱 → + 신규 앱 에서 번들 ID io.github.wjsdbs75afk.marinekiugi 로 앱을 먼저 만들어 주세요. 그다음 이 작업을 다시 실행하면 TestFlight 에 올라갑니다."
            echo "::error::$msg"; echo "$msg" >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi

      # 아카이브는 서명 없이 만든다. 자동 서명으로 아카이브하면 개발용 프로파일(등록된 기기 필요)을 찾다가 실패한다.
      # 배포용 인증서·App Store 프로파일은 다음 단계(내보내기)에서 API 키로 만들어 서명한다.
      - name: 아카이브
        if: env.SIGN == '1'
        working-directory: ios
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          xcodebuild -project MarineKiugi.xcodeproj -scheme MarineKiugi -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/MarineKiugi.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            archive | tail -40

      - name: TestFlight 에 올리기
        if: env.SIGN == '1'
        working-directory: ios
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/MarineKiugi.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" | tail -60
          echo "빌드 #${{ github.run_number }} 을 App Store Connect 에 올렸습니다. 처리(10~30분)가 끝나면 TestFlight 에 뜹니다." >> "$GITHUB_STEP_SUMMARY"

      - name: 키 지우기
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
