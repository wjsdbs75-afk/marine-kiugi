name: 게임 배포 (GitHub Pages)

# game.html 이 바뀌어 main 에 올라오면 https://<계정>.github.io/<저장소>/ 에 자동으로 반영한다.
# 처음 한 번은 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 바꿔 두어야 한다.

on:
  push:
    branches: [main]
    paths:
      - 'game.html'
      - 'tools/build_site.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: 페이지 만들기 (game.html → _site/index.html)
        run: python3 tools/build_site.py _site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: 배포
        id: deployment
        uses: actions/deploy-pages@v5
