:root {
  --ink: #0a0f1c; --fg: #eaf0ff; --fg-dim: #a9b6d6; --hazard: #ffc21f; --night: #05070f;
  --font-display: 'Black Han Sans', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --font-body: 'Gothic A1', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
  touch-action: manipulation; color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
body { background: var(--night); color: var(--fg); overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
#wrap { height: 100%; display: grid; place-items: center; }
#game { --u: 1px; --st: 0px; --sb: 0px; position: relative; overflow: hidden; font-size: calc(var(--u) * 16); font-family: var(--font-body); font-weight: 700; color: var(--fg); line-height: 1.25; }
#safeProbe { position: fixed; left: 0; top: 0; width: 0; visibility: hidden; pointer-events: none; padding-top: var(--safe-top, 0px); padding-bottom: var(--safe-bottom, 0px); }
p, h1 { margin: 0; }
.outline { text-shadow: -.06em -.06em 0 var(--ink), .06em -.06em 0 var(--ink), -.06em .06em 0 var(--ink), .06em .06em 0 var(--ink), 0 -.07em 0 var(--ink), 0 .07em 0 var(--ink), -.07em 0 0 var(--ink), .07em 0 0 var(--ink), 0 .11em 0 var(--ink), -.06em .13em 0 var(--ink), .06em .13em 0 var(--ink), 0 .16em 0 var(--ink); }
.logo { font-size: 1em; white-space: nowrap; margin-top: .1em; display: flex; flex-direction: column; align-items: center; font-family: var(--font-display); font-weight: 400; line-height: 1; transform: rotate(-3deg); }
.logo .l1 { font-size: 4.4em; color: var(--hazard); }
.logo .l2 { font-size: 3.5em; color: var(--fg); margin-left: .9em; }
.logo.v2 { align-items: flex-start; }
.logo.v2 .l2 { margin-left: calc(4.4em * 1.12 / 3.5); margin-top: .1em; }
.logo.v2 .l3 { align-self: flex-end; font-size: 1.55em; color: var(--hazard); margin-top: .15em; letter-spacing: .04em; }
#boot { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; padding: calc(2.2em + var(--st)) 1.4em calc(1.6em + var(--sb));
  background: radial-gradient(ellipse at 50% 38%, #2a3b63 0%, #141d33 55%, #070a14 100%); }
#boot::before, #boot::after { content: ''; position: absolute; left: 0; right: 0; height: .55em; background: repeating-linear-gradient(135deg, var(--hazard) 0 .8em, var(--ink) .8em 1.6em); }
#boot::before { top: var(--st); }
#boot::after { bottom: var(--sb); }
.boot-mid { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .8em; }
.boot-helm { width: 7em; height: 7em; padding: .2em; box-sizing: border-box; object-fit: contain; filter: drop-shadow(0 .3em 0 rgba(0, 0, 0, .5)); }
.boot-low { display: flex; flex-direction: column; align-items: stretch; gap: .55em; }
.boot-txt { text-align: center; font-family: var(--font-display); font-weight: 400; font-size: 1.05em; color: var(--fg); }
.boot-bar { position: relative; height: 1.25em; background: var(--ink); border: .14em solid var(--ink); border-radius: .5em; overflow: hidden; box-shadow: 0 .18em 0 #000; }
.boot-bar i { display: block; height: 100%; width: 0; border-radius: .3em; background: repeating-linear-gradient(135deg, rgba(255, 255, 255, .18) 0 .5em, transparent .5em 1em), linear-gradient(#ffd851, #f2a414); transition: width .2s linear; }
.boot-bar b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-display); font-weight: 400; font-size: .72em; color: #fff; text-shadow: 0 .08em 0 var(--ink), 0 -.08em 0 var(--ink), .08em 0 0 var(--ink), -.08em 0 0 var(--ink); font-variant-numeric: tabular-nums; }
.boot-tip { min-height: 2.6em; text-align: center; font-size: .78em; color: var(--fg-dim); text-wrap: balance; transition: opacity .3s; }
.boot-tip::before { content: '작전 팁'; display: block; font-family: var(--font-display); font-weight: 400; font-size: .9em; color: var(--hazard); letter-spacing: .08em; margin-bottom: .15em; }
</style>

(function () {
  var s = window.MKShell; if (!s) return;
  try { var r = document.documentElement.style; r.setProperty('--safe-top', s.safeTop() + 'px'); r.setProperty('--safe-bottom', s.safeBottom() + 'px'); } catch (e) {}
})();
</script>

      </div>
      <div class="boot-low">
        <p class="boot-txt outline" id="txt">보급품 확인 중</p>
        <div class="boot-bar"><i id="fill"></i><b id="pct">0%</b></div>
        <p class="boot-tip" id="tip"></p>
      </div>

  </div>
</div>
<script>
(function () {
  var TIPS = ["스팀팩은 체력을 대가로 연사와 이동 속도를 끌어올린다.", "바닥에 빨간 표시가 뜨면 곧 공격이 온다. 표시 밖으로 빠져라.", "병영 훈련은 덜 오른 능력부터 자동으로 올라간다.", "한 번 깬 스테이지는 AUTO 로 반복 출격할 수 있다.", "고급 장비 상자를 10회 열면 A급 이상 1개가 보장된다.", "자리를 비워도 작전은 계속된다. 돌아오면 작전 보고를 확인하라.", "체력이 낮을 때는 의무병 근처에 붙어 있어라."];
  var game = document.getElementById('game'), probe = document.getElementById('safeProbe'), wrap = document.getElementById('wrap');
  // 게임의 resize() 와 같은 계산: 논리 가로 390, 세로는 기기 비율 (1.6 ~ 2.4)
  function resize() {
    var vw = wrap.clientWidth || innerWidth, vh = wrap.clientHeight || innerHeight, w = vw, h = vh;
    if (h / w < 1.6) w = Math.min(vw, h / 1.78);
    if (h / w > 2.4) h = w * 2.4;
    var ps = getComputedStyle(probe), gap = (vh - h) / 2;
    game.style.width = w + 'px'; game.style.height = h + 'px';
    game.style.setProperty('--u', (w / 390) + 'px');
    game.style.setProperty('--st', Math.max(0, (parseFloat(ps.paddingTop) || 0) - gap) + 'px');
    game.style.setProperty('--sb', Math.max(0, (parseFloat(ps.paddingBottom) || 0) - gap) + 'px');
  }
  addEventListener('resize', resize); resize();
  // 작전 팁: 시계에 맞춰 3.2초마다 바뀐다 (게임의 로딩 화면과 같은 식이라 넘어갈 때 같은 팁이 이어진다)
  var tipEl = document.getElementById('tip'), TIP_MS = 3200;
  function tipNow() { return TIPS[Math.floor(Date.now() / TIP_MS) % TIPS.length]; }
  tipEl.textContent = tipNow();
  (function next() { setTimeout(function () { tipEl.style.opacity = 0; setTimeout(function () { tipEl.textContent = tipNow(); tipEl.style.opacity = 1; }, 300); next(); }, TIP_MS - (Date.now() + 300) % TIP_MS); })();
  // 앱이 부른다: mkLoad('새 버전을 받는 중', 0.42). 비율을 모르면 생략
  window.mkLoad = function (text, frac) {
    if (text) document.getElementById('txt').textContent = text;
    if (typeof frac === 'number' && frac >= 0) {
      var f = Math.max(0, Math.min(1, frac));
      document.getElementById('fill').style.width = (f * 100).toFixed(1) + '%';
      document.getElementById('pct').textContent = Math.floor(f * 100) + '%';
    }
  };
})();
</script>
