# 아이폰 껍데기 앱. Xcode 프로젝트 파일은 저장소에 두지 않고, Actions 에서 XcodeGen 으로 이 파일에서 만든다.
name: MarineKiugi
options:
  bundleIdPrefix: io.github.wjsdbs75afk
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  MarineKiugi:
    type: application
    platform: iOS
    sources:
      - MarineKiugi
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.wjsdbs75afk.marinekiugi   # 안드로이드 앱 ID 와 같게. 바꾸지 말 것
        PRODUCT_NAME: MarineKiugi
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: MarineKiugi/Info.plist
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: MarineKiugi/Info.plist
      properties:
        CFBundleDisplayName: 마린 키우기
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false        # 표준 HTTPS 만 쓴다 (수출 규정 질문을 건너뛴다)
        UILaunchScreen:
          UIColorName: Night
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown]
        GameURL: https://wjsdbs75-afk.github.io/marine-kiugi/   # 게임 저장이 이 주소(origin)에 묶여 있다. 바꾸지 말 것
